name: Build preview targets

on:
  push:
    branches: [dev, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        shell: python
        run: |
          import json, os
          with open('build-targets.json', encoding='utf-8') as source:
              targets = json.load(source)['targets']
          matrix = {'include': [dict(target, jdks='\n'.join(map(str, sorted({17, target['java']})))) for target in targets]}
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')

  build:
    needs: targets
    runs-on: ubuntu-latest
    name: ${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.jdks }}
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            build-targets.json
      - name: Build and test
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_MINECRAFT: ${{ matrix.minecraft }}
        run: xvfb-run -a pwsh -NoProfile -File ./build.ps1 -Platform "$BUILD_PLATFORM" -Minecraft "$BUILD_MINECRAFT" --console=plain
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ModpackUpdate-${{ matrix.id }}-preview
          path: build/dist/${{ matrix.id }}/*.jar
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.id }}
          path: |
            build/targets/${{ matrix.id }}/reports/tests/
            build/targets/${{ matrix.id }}/test-results/
            updater/build/reports/tests/
            updater/build/test-results/
            bootstrap/build/reports/tests/
            bootstrap/build/test-results/

  windows:
    name: Windows path and recovery checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            **/*.gradle
            gradle.properties
            gradle/wrapper/gradle-wrapper.properties
            build-targets.json
      - name: Build and test on Windows
        shell: pwsh
        run: ./build.ps1 -Platform fabric -Minecraft 1.20.1 --console=plain
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-windows
          path: |
            bootstrap/build/reports/tests/
            bootstrap/build/test-results/
            updater/build/reports/tests/
            updater/build/test-results/
            build/targets/fabric-1.20.1/reports/tests/
            build/targets/fabric-1.20.1/test-results/
