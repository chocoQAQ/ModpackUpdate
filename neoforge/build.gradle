repositories { maven { url = 'https://libraries.minecraft.net/' } }

dependencies {
    compileOnly "net.neoforged.fancymodloader:loader:${buildTarget.dependencies.fml}"
    compileOnly "net.fabricmc:sponge-mixin:${buildTarget.dependencies.mixin}"
    testImplementation "net.neoforged.fancymodloader:loader:${buildTarget.dependencies.fml}"
    testImplementation "net.fabricmc:sponge-mixin:${buildTarget.dependencies.mixin}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def metadata = [version: project.version.toString(), minecraft: buildTarget.minecraft,
                loaderRange: buildTarget.loaderRange, javaVersion: buildTarget.java,
                languageLoaderRange: buildTarget.dependencies.languageLoaderRange,
                mixinMinVersion: buildTarget.dependencies.mixinMinVersion]
processResources {
    inputs.properties(metadata)
    filesMatching(['META-INF/neoforge.mods.toml', 'modpackupdate.neoforge.mixins.json']) { expand metadata }
}

test {
    doFirst {
        systemProperty 'neoforge.test.classpath', sourceSets.test.runtimeClasspath.asPath
        systemProperty 'target.fml', buildTarget.dependencies.fml
    }
}
