modLoader="javafml"
loaderVersion="${languageLoaderRange}"
license="All Rights Reserved"

[[mods]]
modId="modpackupdate"
version="${version}"
displayName="ModpackUpdate"
description='''Checks Modrinth modpack updates early and hands installation to an independent updater.'''

[[mixins]]
config="modpackupdate.neoforge.mixins.json"

[[dependencies.modpackupdate]]
modId="neoforge"
type="required"
versionRange="${loaderRange}"
ordering="NONE"
side="BOTH"

[[dependencies.modpackupdate]]
modId="minecraft"
type="required"
versionRange="[${minecraft}]"
ordering="NONE"
side="BOTH"

[features.modpackupdate]
javaVersion="[${javaVersion},)"
