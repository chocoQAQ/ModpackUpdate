dependencies {
    compileOnly "net.fabricmc:fabric-loader:${buildTarget.loaderVersion}"
    testImplementation "net.fabricmc:fabric-loader:${buildTarget.loaderVersion}"
    testImplementation 'com.google.code.gson:gson:2.11.0'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def metadata = [version: project.version.toString(), minecraft: buildTarget.minecraft,
                loaderRange: buildTarget.loaderRange, javaVersion: buildTarget.java]
processResources {
    inputs.properties(metadata)
    filesMatching('fabric.mod.json') { expand metadata }
}
