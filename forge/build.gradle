repositories {
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://libraries.minecraft.net/' }
}

dependencies {
    compileOnly "net.minecraftforge:fmlloader:${buildTarget.dependencies.fml}"
    compileOnly "net.minecraftforge:javafmllanguage:${buildTarget.dependencies.fml}"
    compileOnly "org.spongepowered:mixin:${buildTarget.dependencies.mixin}"
    testImplementation "net.minecraftforge:fmlloader:${buildTarget.dependencies.fml}"
    testImplementation "net.minecraftforge:javafmllanguage:${buildTarget.dependencies.fml}"
    testImplementation "org.spongepowered:mixin:${buildTarget.dependencies.mixin}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testRuntimeOnly 'org.apache.logging.log4j:log4j-core:2.19.0'
}

def metadata = [version: project.version.toString(), minecraft: buildTarget.minecraft,
                loaderRange: buildTarget.loaderRange, javaVersion: buildTarget.java,
                languageLoaderRange: buildTarget.dependencies.languageLoaderRange,
                mixinMinVersion: buildTarget.dependencies.mixinMinVersion]
processResources {
    inputs.properties(metadata)
    filesMatching(['META-INF/mods.toml', 'modpackupdate.forge.mixins.json']) { expand metadata }
}
jar { manifest { attributes 'MixinConfigs': 'modpackupdate.forge.mixins.json' } }
test {
    doFirst { systemProperty 'forge.test.classpath', sourceSets.test.runtimeClasspath.asPath }
}
