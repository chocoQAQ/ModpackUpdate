plugins { id 'base' }

subprojects {
    apply plugin: 'java'
    group = 'dev.modpackupdate'
    version = '0.2.0'
    repositories {
        mavenCentral()
        maven { url = 'https://maven.fabricmc.net/' }
        maven { url = 'https://maven.neoforged.net/releases/' }
    }
    java {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }
    tasks.withType(AbstractArchiveTask).configureEach {
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
}

tasks.register('dist', Copy) {
    dependsOn ':fabric:jar', ':neoforge:jar', ':updater:jar'
    from project(':fabric').tasks.named('jar')
    from project(':neoforge').tasks.named('jar')
    from project(':updater').tasks.named('jar')
    into layout.buildDirectory.dir('dist')
}
tasks.named('build') { dependsOn 'dist', ':updater:test', ':neoforge:test' }

def platformLoaders = [
    fabric: ['fabric'],
    neoforge: ['neoforge'],
    all: ['fabric', 'neoforge']
]

platformLoaders.each { platform, loaders ->
    tasks.register("${platform}Dist", Sync) {
        group = 'build'
        description = "Builds and tests the ${platform} distribution."
        dependsOn ':updater:build'
        from project(':updater').tasks.named('jar')
        loaders.each { loader ->
            dependsOn ":${loader}:build"
            from project(":${loader}").tasks.named('jar')
        }
        into layout.buildDirectory.dir("dist/${platform}")
    }
}
